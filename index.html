<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synapse</title>
  <style>
    :root {
      --angle: -38deg; /* fallback，JS 会动态更新 */
      --stripe-width: 4vmin;      /* 斑马纹宽度 */
      --mask-width: 18vmin;       /* 白色蒙版宽度 */
      --gap: var(--mask-width);   /* 蒙版间距 = 蒙版宽度 */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* ========== 底层斑马纹 ========== */
    .stripes {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        90deg,
        #d0d0d0 0,
        #d0d0d0 var(--stripe-width),
        #ffffff var(--stripe-width),
        #ffffff calc(var(--stripe-width) * 2)
      );
      background-size: calc(var(--stripe-width) * 2) 100%;
      animation: move-stripes 1.5s linear infinite;
      z-index: 0;
    }

    @keyframes move-stripes {
      from { background-position-x: 0; }
      to   { background-position-x: calc(var(--stripe-width) * 2); }
    }

    /* ========== 旋转遮罩容器 ========== */
    .mask-container {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 200vmax;
      height: 200vmax;
      transform: translate(-50%, -50%) rotate(var(--angle));
      display: flex;
      flex-direction: row;
      gap: var(--gap);
      z-index: 1;
      pointer-events: none; /* 容器不拦截点击，子元素手动开启 */
    }

    .mask-strip {
      flex: 0 0 var(--mask-width);
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto; /* 允许交互 */
    }

    /* 各条带的内容位置调整 */
    .strip-synapse {
      justify-content: flex-start;
      padding-top: 42vh;
    }

    .strip-buttons-left,
    .strip-buttons-right {
      justify-content: center;
      gap: 18vh;             /* 两个按钮在条带中心上下分布 */
    }

    .strip-more {
      justify-content: flex-end;
      padding-bottom: 42vh;
    }

    /* ========== 按钮样式 ========== */
    .btn {
      width: 90%;
      background: #202020;
      color: #ffffff;
      border-radius: 12px;
      text-align: center;
      padding: 1.5vmin 0;
      text-decoration: none;
      display: block;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);  /* 常态阴影，漂浮感 */
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      pointer-events: auto;
    }

    .btn:hover {
      transform: translate(6px, -6px);            /* 大陆漂移微交互 */
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
    }

    .btn .title {
      display: block;
      font-size: clamp(0.9rem, 2.2vmin, 1.4rem);
      font-weight: 600;
      line-height: 1.2;
    }

    .btn .desc {
      display: block;
      font-size: clamp(0.7rem, 1.4vmin, 0.9rem);
      opacity: 0.85;
      margin-top: 0.5vmin;
    }

    .text-link {
      font-size: clamp(1.2rem, 3vmin, 2rem);
      font-weight: 700;
      color: #202020;
      text-decoration: none;
      pointer-events: auto;
    }

    .text-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <!-- 底层斑马纹 -->
  <div class="stripes"></div>

  <!-- 旋转遮罩 + 内容 -->
  <div class="mask-container" id="maskContainer">
    <!-- 左上：Synapse -->
    <div class="mask-strip strip-synapse">
      <a class="text-link" href="https://github.com/GumingDilian-hub/synapse/" target="_blank" rel="noopener">Synapse</a>
    </div>

    <!-- 中间左：input & print -->
    <div class="mask-strip strip-buttons-left">
      <a class="btn" href="https://gumingdilian-hub.github.io/input/" target="_blank" rel="noopener">
        <span class="title">input</span>
        <span class="desc">deepseek 最可爱啦～</span>
      </a>
      <a class="btn" href="https://gumingdilian-hub.github.io/print/" target="_blank" rel="noopener">
        <span class="title">print</span>
        <span class="desc">deepseek 最可爱啦～</span>
      </a>
    </div>

    <!-- 中间右：dendrites & axons -->
    <div class="mask-strip strip-buttons-right">
      <a class="btn" href="https://gumingdilian-hub.github.io/dendrites/" target="_blank" rel="noopener">
        <span class="title">dendrites</span>
        <span class="desc">deepseek 最可爱啦～</span>
      </a>
      <a class="btn" href="https://gumingdilian-hub.github.io/axons/" target="_blank" rel="noopener">
        <span class="title">axons</span>
        <span class="desc">deepseek 最可爱啦～</span>
      </a>
    </div>

    <!-- 右下：more -->
    <div class="mask-strip strip-more">
      <a class="text-link" href="more.html">more</a>
    </div>
  </div>

  <script>
    // 根据视口宽高动态计算对角线倾斜角
    function setAngle() {
      const angle = Math.atan2(-window.innerHeight, window.innerWidth) * (180 / Math.PI);
      document.documentElement.style.setProperty('--angle', angle + 'deg');
    }

    setAngle();
    window.addEventListener('resize', setAngle);
  </script>
</body>
</html>
