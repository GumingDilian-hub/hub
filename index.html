<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一站点</title>
<style>
    :root {
        --stripe-gray: #d0d0d0;
        --card-bg: #202020;
        --white: #ffffff;
        --tilt: 37deg;                      /* JS 开局 arctan 实测覆写 */
        --rot: calc(-1 * var(--tilt));
        --cycle: 12.5%;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        background: var(--white);
        overflow: hidden;
    }

    /* ========== 第 1 层：粗斑马纹，匀速向右 ========== */
    .stripes {
        position: fixed; inset: 0; z-index: 1;
        background: repeating-linear-gradient(90deg,
            var(--stripe-gray) 0 45%,
            var(--white) 45% 100%);
        background-size: var(--cycle) 100%;
        animation: slide 5s linear infinite;
    }
    @keyframes slide {
        from { background-position: 0 0; }
        to   { background-position: 12.5vw 0; }
    }

    /* ========== 第 2 层：白色蒙版（父容器，负责旋转） ========== */
    .mask {
        position: fixed; z-index: 2;
        background: var(--white);
        transform: translate(-50%, -50%) rotate(var(--rot));
    }
    .mask-a { left: 16%; top: 24%; width: 46vw; height: 15vh; }
    .mask-b { left: 36%; top: 46%; width: 66vw; height: 20vh; }
    .mask-c { left: 57%; top: 63%; width: 66vw; height: 20vh; }
    .mask-d { left: 82%; top: 80%; width: 46vw; height: 15vh; }

    /* ========== 第 3 层：黑色按钮，相对定位钉在蒙版上 ========== */
    .card {
        position: absolute; top: 50%;
        height: 72%; width: 42%;
        transform: translateY(-50%);        /* 只负责垂直居中，旋转继承蒙版 */
        background: var(--card-bg);
        color: var(--white);
        border-radius: 1.1vw;
        box-shadow: 0 1vh 2.2vh rgba(32, 32, 32, .22);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1vh;
        text-decoration: none;
        transition: transform .35s cubic-bezier(.2, .7, .3, 1), box-shadow .35s;
    }
    .card-1 { left: 5%; }
    .card-2 { left: 53%; }

    .card:hover {
        transform: translateY(calc(-50% - 1.4vh));
        box-shadow: 0 2.2vh 3.6vh rgba(32, 32, 32, .3);
    }
    .card h2 { font-size: clamp(1.05rem, 2vw, 1.6rem); font-weight: 700; color: var(--white); }
    .card p  { font-size: clamp(.72rem, 1.1vw, .95rem); color: var(--white); opacity: .85; }

    /* ========== 纯倾斜文字，居中钉在首尾蒙版上 ========== */
    .word {
        position: absolute; left: 50%; top: 50%;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        color: var(--card-bg);
        font-size: clamp(1.6rem, 3.6vw, 3rem);
        font-weight: 800;
        text-decoration: none;
        transition: opacity .25s;
    }
    .word:hover { opacity: .7; }

    /* ========== 移动端：蒙版加长，按钮随蒙版自动适配 ========== */
    @media (max-width: 768px) {
        .mask-a { left: 30%; top: 14%; width: max(70vw, 40vh); height: 10vh; }
        .mask-b { left: 45%; top: 28%; width: max(95vw, 60vh); height: 15vh; }
        .mask-c { left: 55%; top: 52%; width: max(95vw, 60vh); height: 15vh; }
        .mask-d { left: 70%; top: 80%; width: max(70vw, 40vh); height: 10vh; }
        .card { border-radius: 3vw; }
    }
</style>
</head>
<body>
    <!-- 第 1 层：粗斑马纹 -->
    <div class="stripes"></div>

    <!-- 第 2 层：白色蒙版，内嵌内容 -->
    <div class="mask mask-a">
        <a href="#" class="word">网页标题</a>
    </div>

    <div class="mask mask-b">
        <a class="card card-1" href="https://gumingdilian-hub.github.io/input/">
            <h2>Input</h2><p>项目简介文字占位</p>
        </a>
        <a class="card card-2" href="https://gumingdilian-hub.github.io/dendrites/">
            <h2>Dendrites</h2><p>项目简介文字占位</p>
        </a>
    </div>

    <div class="mask mask-c">
        <a class="card card-1" href="https://gumingdilian-hub.github.io/axons/">
            <h2>Axons</h2><p>项目简介文字占位</p>
        </a>
        <a class="card card-2" href="https://gumingdilian-hub.github.io/print/">
            <h2>Print</h2><p>项目简介文字占位</p>
        </a>
    </div>

    <div class="mask mask-d">
        <a href="more.html" class="word">其他网页</a>
    </div>

    <script>
        // 开局测量屏幕分辨率，arctan(高/宽) 得对角线角度
        (function () {
            function setTilt() {
                var a = Math.atan2(window.innerHeight, window.innerWidth) * 180 / Math.PI;
                document.documentElement.style.setProperty('--tilt', a.toFixed(2) + 'deg');
            }
            setTilt();
            window.addEventListener('resize', setTilt);
        })();
    </script>
</body>
</html>
