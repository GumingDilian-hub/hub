<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            background: white;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 斑马纹背景层 */
        .zebra-bg {
            position: absolute;
            width: 400%;
            height: 100%;
            left: 0;
            top: 0;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 50px,
                #d0d0d0 50px,
                #d0d0d0 100px
            );
            animation: moveRight 2s linear infinite;
        }

        @keyframes moveRight {
            from { transform: translateX(0); }
            to { transform: translateX(-100px); }
        }

        /* 覆板层 - 制造平行四边形视觉假象 */
        .overlay-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .overlay-shape {
            position: absolute;
            background: white;
        }

        /* 卡片容器 */
        .cards-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* 通用卡片样式 */
        .card {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        /* 按钮卡片（有背景） */
        .card-button {
            background: #b8b8b8;
            border-radius: 12px;
            padding: 25px 35px;
            box-shadow: 0 4px 12px rgba(32, 32, 32, 0.15);
        }

        .card-button:hover {
            box-shadow: 0 12px 28px rgba(32, 32, 32, 0.25);
        }

        /* 文字卡片（无背景） */
        .card-text {
            background: transparent;
            padding: 15px 25px;
        }

        /* 卡片标题 */
        .card-title {
            color: #202020;
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
            text-decoration: none;
            display: block;
        }

        /* 卡片简介 */
        .card-desc {
            color: #ffffff;
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            margin-top: 10px;
            text-align: center;
            line-height: 1.4;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- 斑马纹背景 -->
        <div class="zebra-bg"></div>
        
        <!-- 覆板层（用于制造平行四边形视觉假象） -->
        <div class="overlay-layer" id="overlayLayer"></div>
        
        <!-- 卡片容器 -->
        <div class="cards-container" id="cardsContainer"></div>
    </div>

    <script>
        let currentAngle = 0;

        function calculateAndApplyLayout() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            
            // 计算对角线角度（左下到右上）
            const angleRad = Math.atan2(vh, vw);
            const angleDeg = angleRad * (180 / Math.PI);
            currentAngle = angleDeg;
            
            // 计算卡片尺寸（响应式）
            const baseUnit = Math.min(vw, vh) / 12;
            const cardWidth = baseUnit * 3;
            const cardHeight = baseUnit * 2;
            
            // 创建覆板
            createOverlays(vw, vh, angleRad, baseUnit);
            
            // 创建并定位卡片
            createCards(vw, vh, cardWidth, cardHeight, angleDeg);
        }

        function createOverlays(vw, vh, angleRad, baseUnit) {
            const overlayLayer = document.getElementById('overlayLayer');
            overlayLayer.innerHTML = '';
            
            const angleDeg = -angleRad * (180 / Math.PI);
            const shapeWidth = baseUnit * 2;
            const shapeHeight = baseUnit * 4;
            const spacingX = baseUnit * 1.5;
            const spacingY = baseUnit * 1;
            
            const rows = Math.ceil(vh / spacingY) + 4;
            const cols = Math.ceil(vw / spacingX) + 4;
            
            for (let i = -2; i < rows; i++) {
                for (let j = -2; j < cols; j++) {
                    const overlay = document.createElement('div');
                    overlay.className = 'overlay-shape';
                    
                    const x = j * spacingX;
                    const y = i * spacingY;
                    
                    overlay.style.width = `${shapeWidth}px`;
                    overlay.style.height = `${shapeHeight}px`;
                    overlay.style.left = `${x}px`;
                    overlay.style.top = `${y}px`;
                    overlay.style.transform = `rotate(${angleDeg}deg)`;
                    
                    overlayLayer.appendChild(overlay);
                }
            }
        }

        function createCards(vw, vh, cardWidth, cardHeight, angleDeg) {
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            const cards = [
                { 
                    id: 'card-q', 
                    title: 'My Projects Hub', 
                    desc: '', 
                    xRatio: 0.1, 
                    yRatio: 0.15, 
                    type: 'text',
                    href: '#'
                },
                { 
                    id: 'card-i', 
                    title: 'input', 
                    desc: 'Project description placeholder', 
                    xRatio: 0.25, 
                    yRatio: 0.4, 
                    type: 'button',
                    href: 'https://gumingdilian-hub.github.io/input/'
                },
                { 
                    id: 'card-d', 
                    title: 'Dendrites', 
                    desc: 'Project description placeholder', 
                    xRatio: 0.5, 
                    yRatio: 0.25, 
                    type: 'button',
                    href: 'https://gumingdilian-hub.github.io/dendrites/'
                },
                { 
                    id: 'card-e', 
                    title: 'Axons', 
                    desc: 'Project description placeholder', 
                    xRatio: 0.55, 
                    yRatio: 0.6, 
                    type: 'button',
                    href: 'https://gumingdilian-hub.github.io/axons/'
                },
                { 
                    id: 'card-p', 
                    title: 'print', 
                    desc: 'Project description placeholder', 
                    xRatio: 0.75, 
                    yRatio: 0.45, 
                    type: 'button',
                    href: 'https://gumingdilian-hub.github.io/print/'
                },
                { 
                    id: 'card-w', 
                    title: '其他网页', 
                    desc: '', 
                    xRatio: 0.85, 
                    yRatio: 0.75, 
                    type: 'text',
                    href: 'more.html'
                }
            ];
            
            cards.forEach(cardData => {
                const card = document.createElement('a');
                card.className = `card card-${cardData.type}`;
                card.href = cardData.href;
                
                const x = vw * cardData.xRatio;
                const y = vh * cardData.yRatio;
                
                card.innerHTML = `
                    <div class="card-title">${cardData.title}</div>
                    ${cardData.desc ? `<div class="card-desc">${cardData.desc}</div>` : ''}
                `;
                
                card.style.left = `${x}px`;
                card.style.top = `${y}px`;
                card.style.transform = `translate(-50%, -50%) rotate(${-angleDeg}deg)`;
                
                // 微交互
                card.addEventListener('mouseenter', () => {
                    if (cardData.type === 'button') {
                        card.style.transform = `translate(-50%, -60%) rotate(${-angleDeg}deg) scale(1.05)`;
                    } else {
                        card.style.transform = `translate(-50%, -60%) rotate(${-angleDeg}deg) scale(1.1)`;
                    }
                });
                
                card.addEventListener('mouseleave', () => {
                    card.style.transform = `translate(-50%, -50%) rotate(${-angleDeg}deg)`;
                });
                
                container.appendChild(card);
            });
        }

        // 初始化和响应式处理
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(calculateAndApplyLayout, 150);
        });

        // 页面加载完成后计算布局
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', calculateAndApplyLayout);
        } else {
            calculateAndApplyLayout();
        }
    </script>
</body>
</html>
