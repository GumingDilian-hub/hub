<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            background: white;
        }

        .container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* 斑马纹背景层 */
        .zebra-bg {
            position: absolute;
            width: 300%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                white 0px,
                white 50px,
                #d0d0d0 50px,
                #d0d0d0 100px
            );
            animation: moveRight 2s linear infinite;
        }

        @keyframes moveRight {
            from { transform: translateX(0); }
            to { transform: translateX(-100px); }
        }

        /* 覆板层 - 制造平行四边形视觉假象 */
        .overlay-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        .overlay-shape {
            position: absolute;
            background: white;
            transform-origin: center center;
        }

        /* 卡片容器 */
        .cards-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* 通用卡片样式 */
        .card {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }

        /* 按钮卡片（有背景） */
        .card-button {
            background: #b8b8b8;
            border-radius: 12px;
            padding: 20px 30px;
            box-shadow: 0 4px 12px rgba(32, 32, 32, 0.15);
        }

        .card-button:hover {
            transform: var(--tilt-rotate) translateY(-8px) scale(1.02);
            box-shadow: 0 12px 28px rgba(32, 32, 32, 0.25);
        }

        .card-button:active {
            transform: var(--tilt-rotate) translateY(-4px) scale(0.98);
            box-shadow: 0 6px 16px rgba(32, 32, 32, 0.2);
        }

        /* 文字卡片（无背景） */
        .card-text {
            background: transparent;
            padding: 10px 20px;
        }

        .card-text:hover {
            transform: var(--tilt-rotate) scale(1.05);
        }

        /* 卡片标题 */
        .card-title {
            color: #202020;
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            font-weight: 600;
            text-align: center;
            line-height: 1.2;
        }

        /* 卡片简介 */
        .card-desc {
            color: #ffffff;
            font-size: clamp(0.75rem, 1.8vw, 1rem);
            margin-top: 8px;
            text-align: center;
            line-height: 1.4;
            max-width: 200px;
        }

        /* 链接样式 */
        .card-link {
            text-decoration: none;
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- 斑马纹背景 -->
        <div class="zebra-bg"></div>
        
        <!-- 覆板层（用于制造平行四边形视觉假象） -->
        <div class="overlay-layer" id="overlayLayer"></div>
        
        <!-- 卡片容器 -->
        <div class="cards-container" id="cardsContainer">
            <!-- q: 网页标题（文字卡片） -->
            <a href="#" class="card card-text" id="card-q">
                <div class="card-title">My Projects Hub</div>
            </a>
            
            <!-- i: input（按钮卡片） -->
            <a href="https://gumingdilian-hub.github.io/input/" class="card card-button" id="card-i">
                <div class="card-title">input</div>
                <div class="card-desc">Project description placeholder</div>
            </a>
            
            <!-- d: Dendrites（按钮卡片） -->
            <a href="https://gumingdilian-hub.github.io/dendrites/" class="card card-button" id="card-d">
                <div class="card-title">Dendrites</div>
                <div class="card-desc">Project description placeholder</div>
            </a>
            
            <!-- e: Axons（按钮卡片） -->
            <a href="https://gumingdilian-hub.github.io/axons/" class="card card-button" id="card-e">
                <div class="card-title">Axons</div>
                <div class="card-desc">Project description placeholder</div>
            </a>
            
            <!-- p: print（按钮卡片） -->
            <a href="https://gumingdilian-hub.github.io/print/" class="card card-button" id="card-p">
                <div class="card-title">print</div>
                <div class="card-desc">Project description placeholder</div>
            </a>
            
            <!-- w: 其他网页（文字卡片） -->
            <a href="more.html" class="card card-text" id="card-w">
                <div class="card-title">其他网页</div>
            </a>
        </div>
    </div>

    <script>
        // 动态计算角度和布局
        function calculateAndApplyLayout() {
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            
            // 计算对角线角度（左下到右上）
            const angleRad = Math.atan2(vh, vw);
            const angleDeg = angleRad * (180 / Math.PI);
            
            // 设置CSS变量
            document.documentElement.style.setProperty('--tilt-angle', `${angleDeg}deg`);
            document.documentElement.style.setProperty('--tilt-rotate', `rotate(${-angleDeg}deg)`);
            
            // 计算卡片尺寸（响应式，基于屏幕宽度）
            const baseUnit = Math.min(vw, vh) / 10;
            const cardWidth = baseUnit * 2.5;
            const cardHeight = baseUnit * 1.2;
            
            // 创建覆板（平行四边形视觉假象）
            createOverlays(vw, vh, angleRad, baseUnit);
            
            // 定位卡片
            positionCards(vw, vh, cardWidth, cardHeight, angleDeg);
        }

        function createOverlays(vw, vh, angleRad, baseUnit) {
            const overlayLayer = document.getElementById('overlayLayer');
            overlayLayer.innerHTML = '';
            
            // 创建多个覆板，形成平行四边形阵列
            const rows = Math.ceil(vh / (baseUnit * 0.8)) + 2;
            const cols = Math.ceil(vw / (baseUnit * 1.2)) + 2;
            
            for (let i = -1; i < rows; i++) {
                for (let j = -1; j < cols; j++) {
                    const overlay = document.createElement('div');
                    overlay.className = 'overlay-shape';
                    
                    const width = baseUnit * 1.5;
                    const height = baseUnit * 3;
                    const x = j * baseUnit * 1.2 - baseUnit;
                    const y = i * baseUnit * 0.8 - baseUnit;
                    
                    overlay.style.width = `${width}px`;
                    overlay.style.height = `${height}px`;
                    overlay.style.left = `${x}px`;
                    overlay.style.top = `${y}px`;
                    overlay.style.transform = `rotate(${-angleRad * (180/Math.PI)}deg)`;
                    
                    overlayLayer.appendChild(overlay);
                }
            }
        }

        function positionCards(vw, vh, cardWidth, cardHeight, angleDeg) {
            const cards = [
                { id: 'card-q', xRatio: 0.08, yRatio: 0.12, type: 'text' },
                { id: 'card-i', xRatio: 0.20, yRatio: 0.35, type: 'button' },
                { id: 'card-d', xRatio: 0.45, yRatio: 0.22, type: 'button' },
                { id: 'card-e', xRatio: 0.50, yRatio: 0.55, type: 'button' },
                { id: 'card-p', xRatio: 0.72, yRatio: 0.42, type: 'button' },
                { id: 'card-w', xRatio: 0.82, yRatio: 0.72, type: 'text' }
            ];
            
            cards.forEach(card => {
                const element = document.getElementById(card.id);
                const x = vw * card.xRatio;
                const y = vh * card.yRatio;
                
                element.style.width = card.type === 'button' ? `${cardWidth}px` : 'auto';
                element.style.left = `${x}px`;
                element.style.top = `${y}px`;
                element.style.transform = `translate(-50%, -50%) rotate(${-angleDeg}deg)`;
            });
        }

        // 初始化和响应式处理
        window.addEventListener('resize', () => {
            clearTimeout(window.resizeTimer);
            window.resizeTimer = setTimeout(calculateAndApplyLayout, 100);
        });

        // 页面加载完成后计算布局
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', calculateAndApplyLayout);
        } else {
            calculateAndApplyLayout();
        }
    </script>
</body>
</html>
