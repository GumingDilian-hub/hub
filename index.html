<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一站点</title>
<style>
    :root {
        --stripe-gray: #d0d0d0;
        --card-bg: #202020;
        --white: #ffffff;
        --tilt: 37deg;
        --span: 100vh;
        --rot: calc(-1 * var(--tilt));
        --cycle: 12.5%;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        background: var(--white);
        overflow: hidden;
    }

    /* ========== 第 1 层：粗斑马纹，匀速向右 ========== */
    .stripes {
        position: fixed; inset: 0; z-index: 1;
        background: repeating-linear-gradient(90deg,
            var(--stripe-gray) 0 45%,
            var(--white) 45% 100%);
        background-size: var(--cycle) 100%;
        animation: slide 5s linear infinite;
    }
    @keyframes slide {
        from { background-position: 0 0; }
        to   { background-position: 12.5vw 0; }
    }

    /* ========== 第 2 层：白色蒙版 ==========
       锚定左上角；rotate → 垂直偏移 --off → 沿带居中。
       首尾：超厚 + 中心线穿角点 = 被屏幕裁成三角形
       中间：按 span 比例排布 = 间隙恒定 */
    .mask {
        position: fixed; left: 0; top: 0; z-index: 2;
        width: 200vmax;
        background: var(--white);
        transform: rotate(var(--rot)) translateY(var(--off)) translateX(-50%);
    }
    .mask-a { --off: 0;                          height: 40vh; }  /* 左上三角形 */
    .mask-b { --off: calc(var(--span) * 0.40);   height: 20vh; }
    .mask-c { --off: calc(var(--span) * 0.62);   height: 20vh; }
    .mask-d { --off: var(--span);                height: 40vh; }  /* 右下三角形 */

    /* ========== 第 3 层：黑色按钮 ========== */
    .card {
        position: absolute; top: 50%; left: 50%;
        width: 22vw; height: 72%;
        transform: translate(-50%, -50%) translateX(var(--dx, 0));
        background: var(--card-bg);
        color: var(--white);
        border-radius: 1.1vw;
        box-shadow: 0 1vh 2.2vh rgba(32, 32, 32, .22);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1vh;
        text-decoration: none;
        transition: transform .35s cubic-bezier(.2, .7, .3, 1), box-shadow .35s;
    }
    .card-1 { --dx: -17vw; }
    .card-2 { --dx:  17vw; }

    .card:hover {
        transform: translate(-50%, -50%) translateX(var(--dx, 0)) translateY(-1.4vh);
        box-shadow: 0 2.2vh 3.6vh rgba(32, 32, 32, .3);
    }
    .card h2 { font-size: clamp(1.05rem, 2vw, 1.6rem); font-weight: 700; color: var(--white); }
    .card p  { font-size: clamp(.72rem, 1.1vw, .95rem); color: var(--white); opacity: .85; }

    /* ========== 纯倾斜文字（落在角三角形内） ========== */
    .word {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%) translateX(var(--dx, 0)) translateY(var(--dy, 0));
        white-space: nowrap;
        color: var(--card-bg);
        font-size: clamp(1.6rem, 3.6vw, 3rem);
        font-weight: 800;
        text-decoration: none;
        transition: opacity .25s;
    }
    .word:hover { opacity: .7; }
    .mask-a .word { --dx: 6vw;   --dy: 12vh; }
    .mask-d .word { --dx: -6vw;  --dy: -12vh; }

    /* ========== 移动端适配 ========== */
    @media (max-width: 768px) {
        .mask-b, .mask-c { height: 16vh; }
        .card { width: 42vw; border-radius: 3vw; }
        .card-1 { --dx: -24vh; }
        .card-2 { --dx:  24vh; }
        .mask-a .word { --dx: -10vh; --dy: 12vh; }
        .mask-d .word { --dx: 10vh;  --dy: -12vh; }
    }
</style>
</head>
<body>
    <div class="stripes"></div>

    <div class="mask mask-a">
        <a href="#" class="word">网页标题</a>
    </div>

    <div class="mask mask-b">
        <a class="card card-1" href="https://gumingdilian-hub.github.io/input/">
            <h2>Input</h2><p>项目简介文字占位</p>
        </a>
        <a class="card card-2" href="https://gumingdilian-hub.github.io/dendrites/">
            <h2>Dendrites</h2><p>项目简介文字占位</p>
        </a>
    </div>

    <div class="mask mask-c">
        <a class="card card-1" href="https://gumingdilian-hub.github.io/axons/">
            <h2>Axons</h2><p>项目简介文字占位</p>
        </a>
        <a class="card card-2" href="https://gumingdilian-hub.github.io/print/">
            <h2>Print</h2><p>项目简介文字占位</p>
        </a>
    </div>

    <div class="mask mask-d">
        <a href="more.html" class="word">其他网页</a>
    </div>

    <script>
        (function () {
            function measure() {
                var w = window.innerWidth, h = window.innerHeight;
                var tilt = Math.atan2(h, w) * 180 / Math.PI;
                var span = 2 * w * h / Math.hypot(w, h);
                var s = document.documentElement.style;
                s.setProperty('--tilt', tilt.toFixed(2) + 'deg');
                s.setProperty('--span', span.toFixed(1) + 'px');
            }
            measure();
            window.addEventListener('resize', measure);
        })();
    </script>
</body>
</html>
