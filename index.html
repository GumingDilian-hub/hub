<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>统一站点</title>
<style>
    :root {
        --stripe-gray: #d0d0d0;   /* 条纹灰 */
        --card-bg: #202020;       /* 卡片黑 */
        --white: #ffffff;
        --tilt: 37deg;            /* 由 JS 开局测量屏幕算 arctan 覆写 */
        --rot: calc(-1 * var(--tilt));
        --cycle: 12.5%;           /* 斑马纹一个周期宽度（加粗） */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        background: var(--white);
        overflow: hidden;
    }

    /* ========== 第 1 层：粗斑马纹，匀速向右 ========== */
    .stripes {
        position: fixed; inset: 0; z-index: 1;
        background: repeating-linear-gradient(90deg,
            var(--stripe-gray) 0 45%,
            var(--white) 45% 100%);
        background-size: var(--cycle) 100%;
        animation: slide 5s linear infinite;
    }
    @keyframes slide {
        from { background-position: 0 0; }
        to   { background-position: 12.5vw 0; }  /* 正好一个周期，无缝循环 */
    }

    /* ========== 第 2 层：4 条白色蒙版（切割条纹成平行四边形） ========== */
    .mask {
        position: fixed; z-index: 2;
        background: var(--white);
        transform: translate(-50%, -50%) rotate(var(--rot));
        pointer-events: none;
    }
    .mask-a { left: 16%; top: 24%; width: 46vw; height: 15vh; }
    .mask-b { left: 36%; top: 46%; width: 62vw; height: 20vh; }
    .mask-c { left: 57%; top: 63%; width: 62vw; height: 20vh; }
    .mask-d { left: 82%; top: 80%; width: 46vw; height: 15vh; }

    /* ========== 第 3 层：202020 圆角按钮 ========== */
    .card {
        position: fixed; z-index: 3;
        width: 23%; height: 15vh;
        background: var(--card-bg);
        color: var(--white);
        border-radius: 1.1vw;
        transform: translate(-50%, -50%) rotate(var(--rot));
        box-shadow: 0 1vh 2.2vh rgba(32, 32, 32, .22);   /* 柔和阴影 */
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1vh;
        text-decoration: none;
        transition: transform .35s cubic-bezier(.2, .7, .3, 1), box-shadow .35s;
    }
    /* 悬停微交互：垂直上浮 + 阴影加深 */
    .card:hover {
        transform: translate(-50%, -50%) translateY(-1.4vh) rotate(var(--rot));
        box-shadow: 0 2.2vh 3.6vh rgba(32, 32, 32, .3);
    }
    .card h2 {
        font-size: clamp(1.05rem, 2vw, 1.6rem);
        font-weight: 700; color: var(--white);
    }
    .card p {
        font-size: clamp(.72rem, 1.1vw, .95rem);
        color: var(--white); opacity: .85;
    }

    /* ========== 第 3 层：纯倾斜文字（标题 / 其他网页） ========== */
    .word {
        position: fixed; z-index: 3;
        color: var(--card-bg);
        font-size: clamp(1.6rem, 3.6vw, 3rem);
        font-weight: 800;
        transform: translate(-50%, -50%) rotate(var(--rot));
        text-decoration: none;
        transition: opacity .25s;
    }
    .word:hover { opacity: .7; }

    /* ========== 定位（全部百分比） ========== */
    .pos-title { left: 13%; top: 22%; }
    .pos-i     { left: 21%; top: 50%; }
    .pos-d     { left: 45%; top: 41%; }
    .pos-e     { left: 43%; top: 68%; }
    .pos-p     { left: 66%; top: 59%; }
    .pos-more  { left: 84%; top: 82%; }

    /* ========== 移动端适配 ========== */
    @media (max-width: 768px) {
        .card { width: 42%; height: 12vh; border-radius: 3vw; }
        .mask-a { left: 30%; top: 12%; width: 70vw; height: 10vh; }
        .mask-b { left: 50%; top: 27%; width: 95vw; height: 14vh; }
        .mask-c { left: 50%; top: 49%; width: 95vw; height: 14vh; }
        .mask-d { left: 66%; top: 82%; width: 70vw; height: 10vh; }
        .pos-title { left: 26%; top: 10%; }
        .pos-i { left: 30%; top: 30%; }
        .pos-d { left: 72%; top: 24%; }
        .pos-e { left: 30%; top: 52%; }
        .pos-p { left: 72%; top: 46%; }
        .pos-more { left: 70%; top: 80%; }
    }
</style>
</head>
<body>
    <!-- 第 1 层：粗斑马纹 -->
    <div class="stripes"></div>

    <!-- 第 2 层：4 条白色蒙版 -->
    <div class="mask mask-a"></div>
    <div class="mask mask-b"></div>
    <div class="mask mask-c"></div>
    <div class="mask mask-d"></div>

    <!-- 第 3 层：q 标题（纯文字） -->
    <a href="#" class="word pos-title">网页标题</a>

    <!-- i / d / e / p 四个按钮，贴在中间两条蒙版上 -->
    <a class="card pos-i" href="https://gumingdilian-hub.github.io/input/">
        <h2>Input</h2><p>项目简介文字占位</p>
    </a>
    <a class="card pos-d" href="https://gumingdilian-hub.github.io/dendrites/">
        <h2>Dendrites</h2><p>项目简介文字占位</p>
    </a>
    <a class="card pos-e" href="https://gumingdilian-hub.github.io/axons/">
        <h2>Axons</h2><p>项目简介文字占位</p>
    </a>
    <a class="card pos-p" href="https://gumingdilian-hub.github.io/print/">
        <h2>Print</h2><p>项目简介文字占位</p>
    </a>

    <!-- w 其他网页（纯文字） -->
    <a href="more.html" class="word pos-more">其他网页</a>

    <script>
        // 开局测量屏幕分辨率，arctan(高/宽) 得对角线角度
        (function () {
            function setTilt() {
                var a = Math.atan2(window.innerHeight, window.innerWidth) * 180 / Math.PI;
                document.documentElement.style.setProperty('--tilt', a.toFixed(2) + 'deg');
            }
            setTilt();
            window.addEventListener('resize', setTilt);
        })();
    </script>
</body>
</html>
